name: Test

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 20.12 is the core routing floor; Analyzer needs node:sqlite (22.15+).
        node-version: ["20.12", "22.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - if: matrix.node-version == '20.12'
        run: node --test $(ls test/*.test.mjs | grep -v analyzer.test.mjs)
      - if: matrix.node-version != '20.12'
        run: npm test
